<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>bench_discr_helper viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    #controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    select { padding: 4px; }
    #plot { width: 100%; height: 76vh; }
    small { color: #444; }
  </style>
</head>
<body>
  <h2>bench_discr_helper</h2>
  <div id="controls">
    <label>m:
      <select id="mSel"></select>
    </label>
    <label>dup:
      <select id="dupSel"></select>
    </label>
    <label>y-scale:
      <select id="ySel">
        <option value="log" selected>log</option>
        <option value="linear">linear</option>
      </select>
    </label>
  </div>
  <div id="plot"></div>
  <small>Expected columns: m,n,dup,mode,ms,out_n</small>

<script>
async function loadCSV(path) {
  const txt = await (await fetch(path)).text();
  const lines = txt.trim().split(/\r?\n/);
  const header = lines[0].split(",");
  const rows = [];
  for (let i=1;i<lines.length;i++) {
    const cols = lines[i].split(",");
    const obj = {};
    for (let j=0;j<header.length;j++) obj[header[j]] = cols[j];
    rows.push(obj);
  }
  return rows;
}

function uniq(arr) {
  return Array.from(new Set(arr)).sort((a,b)=> (a<b?-1:a>b?1:0));
}

function toNum(x) { return Number(x); }

function draw(rows, m, dup, yscale) {
  const filt = rows.filter(r => toNum(r.m) === m && toNum(r.dup) === dup);
  const modes = uniq(filt.map(r => r.mode));
  const traces = [];

  for (const mode of modes) {
    const pts = filt.filter(r => r.mode === mode)
                    .sort((a,b)=>toNum(a.n)-toNum(b.n));
    traces.push({
      x: pts.map(p => toNum(p.n)),
      y: pts.map(p => toNum(p.ms)),
      mode: "lines+markers",
      name: mode
    });
  }

  const layout = {
    title: `dedupe: m=${m}, dup=${dup}`,
    xaxis: { title: "n", type: "log" },
    yaxis: { title: "time (ms)", type: yscale },
    legend: { orientation: "h" },
    margin: { t: 48, l: 60, r: 20, b: 60 }
  };

  Plotly.newPlot("plot", traces, layout, {responsive:true});
}

(async () => {
  const rows = await loadCSV("out.csv");

  const mVals = uniq(rows.map(r => toNum(r.m)));
  const dupVals = uniq(rows.map(r => toNum(r.dup)));

  const mSel = document.getElementById("mSel");
  const dupSel = document.getElementById("dupSel");
  const ySel = document.getElementById("ySel");

  for (const v of mVals) {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    mSel.appendChild(o);
  }
  for (const v of dupVals) {
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    dupSel.appendChild(o);
  }

  let curM = mVals[0];
  let curDup = dupVals[0];

  function redraw() {
    curM = Number(mSel.value);
    curDup = Number(dupSel.value);
    draw(rows, curM, curDup, ySel.value);
  }

  mSel.value = curM;
  dupSel.value = curDup;
  redraw();

  mSel.addEventListener("change", redraw);
  dupSel.addEventListener("change", redraw);
  ySel.addEventListener("change", redraw);
})();
</script>
</body>
</html>
